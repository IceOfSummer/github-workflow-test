on:
  issue_comment:
    types: [ created ]


jobs:
  running_ci:
    name: Run CI.
    if: ${{ github.event.issue.pull_request && github.event.comment.body == '/run-ci' }}
    permissions:
      issues: write
      pull-requests: write
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Main Repository
        uses: actions/checkout@v4
        with:
          repository: IceOfSummer/github-workflow-test
          ref: main
          path: template
      - name: Hello world action step
        id: hello
        uses: nextjs-particlex-theme/sitemap-generate@master
        with:
          source-path: 'template'
          output-path: 'html'
          base-path: 'https://foo.bar'
          commit-message: 'Update sitemap.'

    outputs:
      changed: ${{ steps.ci_result.outputs.changed }}
  test:
    name: 'Run unit test'
    runs-on: ubuntu-latest
    if: ${{ needs.running_ci.outputs.changed == 0 }}
    needs: running_ci
    steps:
      - name: echo
        run: echo $CHANGED && env
        env:
          CHANGED: ${{ needs.running_ci.outputs.changed }}
